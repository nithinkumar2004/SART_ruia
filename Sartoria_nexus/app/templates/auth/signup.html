{% extends "base.html" %}

{% block title %}Sartoria Nexus — Brand Onboarding{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; padding: 40px 0;">
    <div class="glass-card animate-fade" style="width: 100%; max-width: 460px; margin-bottom: 0;">
        
        <div style="text-align: center; margin-bottom: 25px;">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Sartoria Nexus Logo" style="height: 70px; width: auto; margin-bottom: 15px; border: 1px solid rgba(29, 56, 100, 0.08); border-radius: 10px; box-shadow: 0 8px 20px rgba(29, 56, 100, 0.06);">
            <h2 style="font-size: 1.8rem; margin-bottom: 6px;">Register Brand Node</h2>
            <p style="font-size: 0.85rem; color: var(--text-secondary);">Start digitizing your physical catalog</p>
        </div>
        
        <!-- Auth Method Tabs -->
        <div style="display: flex; background: rgba(255,255,255,0.03); border: 1px solid var(--border-glass); border-radius: 10px; padding: 4px; margin-bottom: 25px;">
            <button type="button" id="tab-email" class="btn" style="flex: 1; padding: 8px; font-size: 0.85rem; background: var(--neon-pink); color: white; border-radius: 8px;">
                <i class="fa-solid fa-envelope"></i> Email Signup
            </button>
            <button type="button" id="tab-phone" class="btn" style="flex: 1; padding: 8px; font-size: 0.85rem; background: transparent; color: var(--text-secondary); border-radius: 8px;">
                <i class="fa-solid fa-phone"></i> Phone Signup
            </button>
        </div>
        
        <!-- Email Sign Up Form -->
        <form id="form-email" action="/signup" method="POST" class="animate-fade">
            <input type="hidden" name="auth_type" value="email">
            
            <div class="form-group">
                <label for="email" class="form-label">Company Email Address</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="boutique@brand.com" required>
            </div>
            
            <div class="form-group" style="margin-bottom: 25px;">
                <label for="password" class="form-label">Choose Strong Password</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-glow" style="width: 100%; padding: 14px;">
                <i class="fa-solid fa-user-plus"></i> Initiate Brand Account
            </button>
        </form>
        
        <!-- Phone Sign Up Form -->
        <form id="form-phone" action="/signup" method="POST" style="display: none;" class="animate-fade">
            <input type="hidden" name="auth_type" value="phone">
            
            <div class="form-group" style="margin-bottom: 25px;">
                <label for="phone" class="form-label">Company Phone Number</label>
                <input type="tel" id="phone" name="phone" class="form-input" placeholder="+1 (555) 019-2834">
                <span style="font-size: 0.75rem; color: var(--text-muted); margin-top: 4px;">
                    Receive a simulated OTP authentication token to verify your mobile node.
                </span>
            </div>
            
            <button type="submit" class="btn btn-accent btn-glow" style="width: 100%; padding: 14px;">
                <i class="fa-solid fa-paper-plane"></i> Request OTP Registration
            </button>
        </form>
        
        <div style="text-align: center; margin-top: 25px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.05); font-size: 0.85rem; color: var(--text-secondary);">
            Already have a node? <a href="/login">Portal Login</a>
        </div>
        
    </div>
</div>

<script>
    const tabEmail = document.getElementById('tab-email');
    const tabPhone = document.getElementById('tab-phone');
    const formEmail = document.getElementById('form-email');
    const formPhone = document.getElementById('form-phone');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const phoneInput = document.getElementById('phone');

    tabEmail.addEventListener('click', () => {
        tabEmail.style.background = 'var(--neon-pink)';
        tabEmail.style.color = 'white';
        tabPhone.style.background = 'transparent';
        tabPhone.style.color = 'var(--text-secondary)';
        formEmail.style.display = 'block';
        formPhone.style.display = 'none';
        
        emailInput.required = true;
        passwordInput.required = true;
        phoneInput.required = false;
    });

    tabPhone.addEventListener('click', () => {
        tabPhone.style.background = 'var(--neon-pink)';
        tabPhone.style.color = 'white';
        tabEmail.style.background = 'transparent';
        tabEmail.style.color = 'var(--text-secondary)';
        formEmail.style.display = 'none';
        formPhone.style.display = 'block';
        
        emailInput.required = false;
        passwordInput.required = false;
        phoneInput.required = true;
    });
</script>
{% endblock %}
