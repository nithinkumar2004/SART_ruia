{% extends "base.html" %}

{% block title %}Sartoria Nexus — Verify OTP{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; padding: 40px 0;">
    <div class="glass-card animate-fade" style="width: 100%; max-width: 440px; margin-bottom: 0;">
        
        <div style="text-align: center; margin-bottom: 30px;">
            <i class="fa-solid fa-shield-halved" style="font-size: 3rem; color: var(--neon-pink); filter: drop-shadow(0 0 15px var(--neon-pink)); margin-bottom: 15px;"></i>
            <h2 style="font-size: 1.8rem; margin-bottom: 6px;">Node Authentication</h2>
            <p style="font-size: 0.85rem; color: var(--text-secondary);">Verify verification code sent to <strong>{{ phone }}</strong></p>
        </div>
        
        <form action="/verify-otp" method="POST">
            <div class="form-group" style="margin-bottom: 25px;">
                <label for="otp" class="form-label" style="text-align: center;">Enter 6-Digit Code</label>
                <input type="text" id="otp" name="otp" class="form-input" placeholder="000 000" maxlength="6" style="text-align: center; letter-spacing: 0.5em; font-size: 1.5rem; font-family: var(--font-heading); font-weight: bold;" required autofocus autocomplete="off">
                <span style="font-size: 0.75rem; color: var(--text-muted); text-align: center; margin-top: 8px; display: block;">
                    Check the flashed notification at the top of the browser for your simulated verification token.
                </span>
            </div>
            
            <button type="submit" class="btn btn-primary btn-glow" style="width: 100%; padding: 14px;">
                <i class="fa-solid fa-lock-open"></i> Complete Authentication
            </button>
        </form>
        
        <div style="text-align: center; margin-top: 25px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.05); font-size: 0.85rem;">
            <a href="/login"><i class="fa-solid fa-arrow-left"></i> Back to Sign-in</a>
        </div>
        
    </div>
</div>
{% endblock %}
