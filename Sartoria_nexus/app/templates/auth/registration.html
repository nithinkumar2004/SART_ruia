{% extends "base.html" %}

{% block title %}Sartoria Nexus — Brand Onboarding{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; padding: 20px 0;">
    <div class="glass-card animate-fade" style="width: 100%; max-width: 650px; margin-bottom: 0;">
        
        <div style="text-align: center; margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 20px;">
            <i class="fa-solid fa-id-card" style="font-size: 2.8rem; color: var(--neon-pink); margin-bottom: 12px;"></i>
            <h2 style="font-size: 1.8rem; margin-bottom: 6px;">Business Profile Registration</h2>
            <p style="font-size: 0.85rem; color: var(--text-secondary);">Configure your digital boutique identity settings</p>
        </div>
        
        <form action="/register-business" method="POST" enctype="multipart/form-data">
            
            <!-- SECTION 1: Profile Details -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                <div class="form-group">
                    <label for="business_name" class="form-label">Brand/Boutique Name *</label>
                    <input type="text" id="business_name" name="business_name" class="form-input" placeholder="Nova Haute Couture" required>
                </div>
                
                <div class="form-group">
                    <label for="business_type" class="form-label">Business Segment *</label>
                    <select id="business_type" name="business_type" class="form-input form-select" required>
                        <option value="" disabled selected>Select Business Type</option>
                        <option value="Boutique">Boutique</option>
                        <option value="Fashion Brand">Fashion Brand</option>
                        <option value="Garment Seller">Garment Seller</option>
                        <option value="Textile Manufacturer">Textile Manufacturer</option>
                        <option value="Reseller">Reseller</option>
                        <option value="Designer Studio">Designer Studio</option>
                        <option value="Clothing Startup">Clothing Startup</option>
                    </select>
                </div>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                <div class="form-group">
                    <label for="email" class="form-label">Primary Contact Email</label>
                    <input type="email" id="email" class="form-input" value="{{ current_user.email }}" disabled style="opacity: 0.65; cursor: not-allowed;">
                </div>
                
                <div class="form-group">
                    <label for="phone" class="form-label">Primary Contact Phone</label>
                    <input type="text" id="phone" class="form-input" value="{{ current_user.phone or 'Not Provided' }}" disabled style="opacity: 0.65; cursor: not-allowed;">
                </div>
            </div>
            
            <!-- SECTION 2: Operational Specifics -->
            <div class="form-group" style="margin-bottom: 25px;">
                <label class="form-label">Garment Inventory Source *</label>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 5px;">
                    <div>
                        <input type="radio" id="src-mobile" name="inventory_source" value="Mobile Device Uploads" class="category-checkbox" checked>
                        <label for="src-mobile" class="category-label" style="display: block; text-align: left; padding: 12px 16px;">
                            <i class="fa-solid fa-mobile-screen-button" style="margin-right: 8px; color: var(--neon-pink);"></i> Mobile Uploads
                        </label>
                    </div>
                    <div>
                        <input type="radio" id="src-dslr" name="inventory_source" value="DSLR/Professional Catalog" class="category-checkbox">
                        <label for="src-dslr" class="category-label" style="display: block; text-align: left; padding: 12px 16px;">
                            <i class="fa-solid fa-camera" style="margin-right: 8px; color: var(--royal-purple);"></i> DSLR Catalog
                        </label>
                    </div>
                    <div>
                        <input type="radio" id="src-wh" name="inventory_source" value="Warehouse Bulk Upload" class="category-checkbox">
                        <label for="src-wh" class="category-label" style="display: block; text-align: left; padding: 12px 16px;">
                            <i class="fa-solid fa-boxes-stacked" style="margin-right: 8px; color: var(--tech-indigo);"></i> Warehouse Bulk
                        </label>
                    </div>
                    <div>
                        <input type="radio" id="src-api" name="inventory_source" value="API Integration" class="category-checkbox">
                        <label for="src-api" class="category-label" style="display: block; text-align: left; padding: 12px 16px;">
                            <i class="fa-solid fa-network-wired" style="margin-right: 8px; color: #00ff66;"></i> API Integration
                        </label>
                    </div>
                </div>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px;">
                <div class="form-group">
                    <label for="website_url" class="form-label">Website URL (Optional)</label>
                    <input type="url" id="website_url" name="website_url" class="form-input" placeholder="https://www.brand.com">
                </div>
                
                <div class="form-group">
                    <label for="gst_id" class="form-label">GST/Business ID (Optional)</label>
                    <input type="text" id="gst_id" name="gst_id" class="form-input" placeholder="22AAAAA0000A1Z5">
                </div>
            </div>
            
            <!-- SECTION 3: Branding & Assets -->
            <div class="form-group" style="margin-bottom: 30px;">
                <label class="form-label">Official Boutique Logo</label>
                
                <div class="upload-dragzone" id="upload-dragzone">
                    <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>
                    <div id="dragzone-prompt">
                        <p style="font-weight: 500; font-size: 0.95rem;">Drag and drop your brand logo here</p>
                        <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 4px;">PNG, JPG, WEBP formats allowed (Max 5MB)</p>
                    </div>
                    
                    <div class="file-preview-container" id="file-preview-container">
                        <img id="file-preview" class="file-preview" src="#" alt="Logo Preview">
                    </div>
                </div>
                
                <input type="file" id="business_logo" name="business_logo" style="display: none;" accept="image/png, image/jpeg, image/jpg, image/webp">
            </div>
            
            <button type="submit" class="btn btn-primary btn-glow" style="width: 100%; padding: 14px; font-size: 1.05rem;">
                <i class="fa-solid fa-circle-check"></i> Finalize Boutique Registration
            </button>
            
        </form>
    </div>
</div>
{% endblock %}
