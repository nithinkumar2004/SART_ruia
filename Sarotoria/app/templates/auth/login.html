{% extends "base.html" %}

{% block title %}Sarotoria — Portal Login{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 70vh; padding: 40px 0;">
    <div class="glass-panel glow-primary" style="width: 100%; max-width: 480px; padding: 40px; border-radius: 28px;">
        <div style="text-align: center; margin-bottom: 30px; display: flex; flex-direction: column; align-items: center; gap: 8px;">
            <div class="user-badge" style="width: max-content;">
                <span class="indicator"></span> ENTER AI UNIVERSE
            </div>
            <h2 style="font-size: 1.8rem; font-family: var(--font-heading); color: var(--text-main);">Welcome Back</h2>
            <p style="font-size: 0.88rem; color: var(--text-sub);">Sign in to resume virtual fittings and conversational styling</p>
        </div>

        <form action="{{ url_for('auth.login') }}" method="POST" style="display: flex; flex-direction: column; gap: 5px;">
            <div class="form-group">
                <label for="email" class="form-label"><i class="fa-solid fa-envelope"></i> Email Address</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="e.g. fashion@sarotoria.app" required>
            </div>
            
            <div class="form-group" style="margin-bottom: 25px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <label for="password" class="form-label"><i class="fa-solid fa-lock"></i> Password</label>
                </div>
                <input type="password" id="password" name="password" class="form-input" placeholder="Enter secure password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-glow" style="width: 100%; padding: 14px; font-size: 1rem;"><i class="fa-solid fa-right-to-bracket"></i> Sign In to Platform</button>
        </form>

        <div style="text-align: center; margin-top: 25px; border-top: 1px solid var(--border-glass); padding-top: 20px;">
            <p style="font-size: 0.88rem; color: var(--text-sub);">New to Sarotoria? <a href="{{ url_for('auth.signup') }}" style="font-weight: 600; color: var(--primary);">Create Account <i class="fa-solid fa-arrow-right-long" style="font-size: 0.75rem;"></i></a></p>
        </div>
    </div>
</div>
{% endblock %}
